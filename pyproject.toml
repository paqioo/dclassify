[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-classifier-cli"
version = "0.1.0"
description = "A Privacy-First, Local-AI Powered CLI Tool & Web UI for Smart Document Organization."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "doc-classifier-cli contributors"}]
keywords = ["document", "classifier", "ai", "local", "privacy", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.11",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.1",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
dclassify = "doc_classifier.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
