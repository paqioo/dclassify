# doc-classifier-cli - example configuration.
# Copy this file as "config.yaml" in the project folder and adjust,
# or let the app auto-create config at ~/.doc-classifier/config.yaml.

classification:
  default_model: ollama/qwen2.5:1.5b   # local Ollama model (privacy-first)
  max_chars: 2000                   # initial characters sent to AI
  temperature: 0.1
  fallback_keywords: true

paths:
  # Source folder with messy documents (e.g. Downloads).
  source_dir: C:\Users\YOUR_NAME\Downloads
  # Target folder for organized archive.
  output_dir: C:\Users\YOUR_NAME\Documents\OrganizedDocs

taxonomy:
  Documents:
    keywords: []
    folder: Documents
  Spreadsheets:
    keywords: []
    folder: Spreadsheets
  Images:
    keywords: []
    folder: Images
  Audio:
    keywords: []
    folder: Audio

file_naming:
  pattern: '{title}'
  date_format: '%Y-%m-%d'
  max_length: 255
  sanitize_chars: true